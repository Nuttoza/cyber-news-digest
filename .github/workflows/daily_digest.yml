name: Daily Cyber Threat News Digest

on:
  # ปิด schedule ของ GitHub ไว้ เพื่อไม่ให้รันซ้ำซ้อนกับ Google Cloud Scheduler
  # schedule:
  #   - cron: '33 23 * * *'
  workflow_dispatch: # รองรับการสั่งรันจาก Google Cloud Scheduler และกดปุ่มเองบนหน้าเว็บ

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Genuine TH Sarabun Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-thai-tlwg fontconfig
          sudo mkdir -p /usr/local/share/fonts/truetype/thsarabun
          sudo cp assets/fonts/*.ttf /usr/local/share/fonts/truetype/thsarabun/
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cyber Threat News Aggregator & Generate Reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Publish Daily Release for Team Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: digest-${{ github.run_number }}
          name: "รายงานข่าวไซเบอร์ประจำวัน (รอบที่ ${{ github.run_number }})"
          files: output/*
          
      - name: Commit Latest Preview to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          if [ -f output/latest_preview.png ]; then
            cp output/latest_preview.png docs/latest_preview.png
            git add docs/latest_preview.png
            git diff --staged --quiet || (git commit -m "chore: update latest report preview [skip ci]" && git push)
          fi

      - name: Send Release Notification to LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN_2: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_2 }}
          LINE_USER_ID_2: ${{ secrets.LINE_USER_ID_2 }}
        run: |
          python line_notifier.py
